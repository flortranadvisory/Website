<style>
  :root{
    --gold:#C49A2A; --gold-light:#E8C55A; --gold-muted:#A07E22;
    --navy:#0E1A2B; --navy-mid:#162338; --navy-light:#1E3050;
    --cream:#FAF7F2; --cream-dark:#F0EBE0; --white:#fff;
    --text-dark:#0E1A2B; --text-mid:#3D4F66; --text-light:#6B7E96;
    --border:rgba(196,154,42,.18); --border-soft:rgba(14,26,43,.07);
    --shadow-gold:0 12px 40px rgba(196,154,42,.18);
    --shadow-navy:0 20px 60px rgba(14,26,43,.14);

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  body{font-family:var(--font-body); background:var(--cream); color:var(--text-dark); overflow-x:hidden; -webkit-font-smoothing:antialiased}
  a{color:inherit}
  /* Topbar */
  .fl-topbar{

    border-bottom:1px solid var(--border);
    padding:14px clamp(16px,5vw,56px);
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    position:sticky; top:0; z-index:50;
  }
  .fl-logo{display:inline-flex; align-items:center; gap:12px; text-decoration:none}
  .fl-logo img{height:42px; width:auto; display:block}
  .fl-logo-fallback{font-family:var(--font-display); font-weight:700; letter-spacing:.14em; color:var(--navy); font-size:1.15rem; display:none}
  .fl-logo-fallback span{color:var(--gold); font-style:italic; letter-spacing:.02em; font-weight:400; font-size:.95rem}
  .fl-topbar-right{display:flex; align-items:center; gap:12px; font-size:.82rem; color:var(--text-mid)}
  .fl-topbar-right a{font-weight:700; color:var(--navy); text-decoration:none; display:inline-flex; align-items:center; gap:6px}
  .fl-badge{
    display:inline-flex; align-items:center; gap:7px;
    font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
    color:var(--gold); background:rgba(196,154,42,.10); border:1px solid rgba(196,154,42,.18);
    padding:6px 10px; border-radius:999px;
  }
  .fl-badge i{width:7px;height:7px;border-radius:50%;background:#1aaa72; display:inline-block; box-shadow:0 0 0 6px rgba(26,170,114,.12)}
  /* Hero */

    max-width:1240px; margin:0 auto;
    padding:28px clamp(16px,5vw,56px) 48px;

    position:relative;
  }
  .hero::before{
    content:''; position:absolute; top:-8%; right:-6%; width:560px; height:560px;
    background:radial-gradient(circle at 50% 40%, rgba(196,154,42,.07) 0%, transparent 66%);
    pointer-events:none;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-size:.70rem; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--gold);
    margin-bottom:16px;

  .eyebrow::after{content:''; width:32px; height:1px; background:var(--gold); opacity:.6}

  .hero .sub{
    font-size:1.05rem; line-height:1.7; color:var(--text-mid); font-weight:300; max-width:560px; margin-bottom:26px;
  }
  /* Toolkit include box */

    transition:.2s var(--ease-out);

  .toolkit-list li:hover{border-color:rgba(196,154,42,.22); background:#fff}
  .tk-icon{

  .hero-trust strong{color:var(--navy)}
  .hero-trust svg{width:14px; color:var(--gold)}

    box-shadow:var(--shadow-navy); overflow:hidden; position:relative;
  }
  .form-card::before{content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),var(--gold-light),transparent)}

    font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
    color:var(--gold); background:rgba(196,154,42,.10); border:1px solid rgba(196,154,42,.18); padding:6px 10px; border-radius:999px;
  }
  .form-card-body{padding:22px 26px 26px}
  .systeme-form-wrap{
    background:#fff; border:1.5px dashed rgba(196,154,42,.28); border-radius:10px; padding:14px;

  }
  .systeme-hint i{width:8px;height:8px;border-radius:50%;background:var(--gold); display:inline-block; animation:pulse 1.6s infinite}

  .field label{

  }

    width:100%; padding:13px 14px; border-radius:8px; border:1.5px solid rgba(14,26,43,.14);

    transition:.2s; outline:none;
  }
  .field input::placeholder{color:var(--text-light)}
  .field input:focus{border-color:var(--gold); background:#fff; box-shadow:0 0 0 3px rgba(196,154,42,.12)}
  .btn-primary{
    width:100%; display:inline-flex; align-items:center; justify-content:center; gap:10px;
    background:var(--gold); color:#fff; border:1.5px solid var(--gold);
    padding:15px 22px; border-radius:8px; font-family:var(--font-body); font-size:.95rem; font-weight:800;
    letter-spacing:.06em; text-transform:uppercase; cursor:pointer; transition:.25s var(--ease-out);
    box-shadow:var(--shadow-gold); margin-top:6px;
  }
  .btn-primary:hover{background:var(--gold-muted); border-color:var(--gold-muted); transform:translateY(-1px); box-shadow:0 16px 32px rgba(196,154,42,.28)}
  .btn-primary:active{transform:translateY(0)}
  .micro{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:12px; font-size:.74rem; color:var(--text-light); line-height:1.4; text-align:center;
  }
  .micro svg{width:14px; flex:none; color:var(--gold)}

    margin-top:18px; padding-top:16px; border-top:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;
    font-size:.76rem; color:var(--text-light);
  }
  .form-footer span{display:inline-flex; align-items:center; gap:6px}
  .form-footer svg{width:14px; color:var(--gold)}
  /* Proof bar */
  .proof-bar{
    max-width:1240px; margin:0 auto; background:#fff; border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft);
    padding:16px clamp(16px,5vw,56px); display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
  }

  .proof-logos{display:flex; gap:16px; align-items:center; opacity:.55; font-size:.78rem; font-weight:700; letter-spacing:.08em; color:var(--navy)}
  /* What's inside */
  .section{padding:56px clamp(16px,5vw,56px); max-width:1240px; margin:0 auto}
  .eyebrow-center{display:flex; align-items:center; justify-content:center; gap:14px; font-size:.68rem; letter-spacing:.22em; text-transform:uppercase; font-weight:700; color:var(--gold); margin-bottom:10px}
  .eyebrow-center::before, .eyebrow-center::after{content:''; width:26px; height:1px; background:var(--gold); opacity:.5}
  .h2{font-family:var(--font-display); font-size:clamp(1.9rem,3.2vw,2.55rem); font-weight:600; line-height:1.12; color:var(--navy); text-align:center; margin-bottom:10px}
  .sub-center{font-size:.98rem; line-height:1.7; color:var(--text-mid); text-align:center; max-width:680px; margin:0 auto 32px; font-weight:300}
  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
  .card{
    background:#fff; border:1px solid var(--border-soft); border-radius:14px; padding:24px 22px; position:relative; overflow:hidden;
    transition:.3s var(--ease-out);
  }
  .card::before{content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),var(--gold-light)); transform:scaleX(0); transform-origin:left; transition:.35s var(--ease-out)}
  .card:hover{transform:translateY(-4px); box-shadow:var(--shadow-navy); border-color:rgba(196,154,42,.18)}

  .card h3{font-size:1.02rem; font-weight:700; color:var(--navy); margin-bottom:8px}

  .card li{display:flex; gap:8px; font-size:.84rem; line-height:1.5; color:var(--text-mid)}
  .card li i{color:var(--gold); flex:none; margin-top:2px}
  /* Steps */

  .step{background:var(--cream); border:1px solid var(--border-soft); border-radius:12px; padding:20px}
  .step-num{width:28px; height:28px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.82rem; margin-bottom:12px}

  .step p{font-size:.86rem; line-height:1.6; color:var(--text-light); margin-top:6px}
  /* Quote */
  .quote-wrap{
    background:#fff; border:1px solid var(--border-soft); border-radius:16px; padding:26px;
    display:grid; grid-template-columns:96px 1fr; gap:22px; align-items:center; box-shadow:var(--shadow-navy); max-width:980px; margin:0 auto;
  }
  .quote-avatar{width:96px; height:96px; border-radius:50%; background:var(--cream); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--gold); font-family:var(--font-display); font-size:1.8rem; font-weight:700}
  .quote-text{font-family:var(--font-display); font-size:1.18rem; line-height:1.55; color:var(--navy); font-style:italic}
  .quote-meta{margin-top:10px; font-size:.84rem; color:var(--text-mid)} .quote-meta strong{color:var(--navy)}
  .stars{color:var(--gold); letter-spacing:.10em; font-size:.9rem; margin-bottom:8px}
  /* Final CTA */
  .cta-navy{
    background:var(--navy); color:#fff; border-radius:16px; padding:32px clamp(18px,4vw,32px);
    display:grid; grid-template-columns:1.2fr auto; gap:22px; align-items:center; position:relative; overflow:hidden; max-width:1240px; margin:0 auto;
  }
  .cta-navy::before{content:''; position:absolute; right:-8%; top:-40%; width:420px; height:420px; background:radial-gradient(circle, rgba(196,154,42,.14) 0%, transparent 66%); pointer-events:none}

  .fl-footer{background:var(--navy); color:rgba(255,255,255,.68); padding:28px clamp(16px,5vw,56px) 22px; margin-top:48px}

  .fl-footer-links a:hover{color:var(--gold-light)}

    .cta-navy{grid-template-columns:1fr}
    .quote-wrap{grid-template-columns:1fr; text-align:center}

    .fl-topbar{padding:12px 14px}

    .section{padding:40px 14px}
    .proof-bar{justify-content:center; text-align:center}
