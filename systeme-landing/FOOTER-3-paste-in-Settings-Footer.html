<script>

  // ——— Fallback form: replace this with Systeme.io script when ready ———
  (function(){
    const form = document.getElementById('toolkit-form');
    const err = document.getElementById('form-error');
    const toast = document.getElementById('toast-success');
    if(!form) return;
    form.addEventListener('submit', function(e){
      e.preventDefault();
      err.style.display='none';
      const fname = document.getElementById('fname').value.trim();
      const email = document.getElementById('email').value.trim();
      // simple validation
      if(!fname){ err.textContent='Please enter your first name.'; err.style.display='block'; return; }
      if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        err.textContent='Please enter a valid email address.'; err.style.display='block'; return;
      }
      // If Systeme.io script exists, let it handle submission (hidden fallback would already be gone)
      const hasSysteme = document.querySelector('#systeme-form-wrap script[src*="systeme.io"]');
      if(hasSysteme){ return; } // don't intercept — let Systeme.io handle
      // Simulated success (since no backend yet). Replace with fetch to your endpoint or Systeme.io.
      form.style.display='none';
      toast.style.display='block';
      toast.scrollIntoView({behavior:'smooth', block:'center'});
      // Optional: store lead locally for preview
      try{ localStorage.setItem('flortran_toolkit_lead', JSON.stringify({fname,email,at:new Date().toISOString()})); }catch(_){}
      // If you host standalone and want to redirect to thankyou page:
      // setTimeout(()=> location.href='flortran-systeme-thankyou.html', 1800);
    });
    // Hide fallback if Systeme.io script is injected later
    const obs = new MutationObserver(()=>{
      const has = document.querySelector('#systeme-form-wrap script[src*="systeme.io"]');
      if(has && form) { form.style.display='none'; }
    });
    obs.observe(document.body, {childList:true, subtree:true});
  })();

</script>
